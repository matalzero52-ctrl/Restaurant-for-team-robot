<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แก้ไขร้านอาหาร</title>
<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">

<h2>
✏️ แก้ไขร้านอาหาร
</h2>

<hr>
<form method="POST">
<div class="mb-3">
<label>
ชื่อร้าน
</label>
<input
type="text"
class="form-control"
name="name"
value="{{ restaurant.name }}"
required>
</div>

<div class="mb-3">
<label>
จังหวัด
</label>
<select class="form-select" name="province" id="province" required>
    <option value="">-- เลือกจังหวัด --</option>
    {% for p in provinces %}
    <option
        value="{{ p.name }}"
        {% if restaurant.province == p.name %}
        selected
        {% endif %}
    >
        {{ p.name }}
    </option>
    {% endfor %}
</select>
</div>

<div class="mb-3">
<label>
นิคม
</label>
<select class="form-select" name="industrial_estate" id="industrial_estate" required>
    <option value="">-- เลือกนิคม --</option>

    {% for i in industrial_estates %}
    <option
        value="{{ i.name }}"
        data-province="{{ i.province }}"
        {% if restaurant.industrial_estate == i.name %}
        selected
        {% endif %}
    >
        {{ i.province }} - {{ i.name }}
    </option>
    {% endfor %}
</select>
</div>
<script>
const province = document.getElementById("province");
const estate = document.getElementById("industrial_estate");
function filterEstate(){
    const selectedProvince = province.value;
    for(let option of estate.options){
        if(option.value === ""){
            continue;
        }
        if(option.dataset.province === selectedProvince){
            option.hidden = false;
        }
        else{
            option.hidden = true;
        }
    }
}
// ตอนเปิดหน้า edit ให้ filter ทันที
filterEstate();
province.addEventListener(
"change",
function(){
    estate.value = "";
    filterEstate();
});
</script>

<div class="mb-3">
<label>
Google Map
</label>
<input
type="url"
class="form-control"
name="google_map"
value="{{ restaurant.google_map }}" required>
</div>

<div class="mb-3">
<label>
ผู้เพิ่ม
</label>
<input
type="text"
class="form-control"
name="created_by"
value="{{ restaurant.created_by }}"
required>
</div>

<button class="btn btn-warning">
💾 บันทึกแก้ไข
</button>

<a href="/" class="btn btn-secondary">
ย้อนกลับ
</a>
</form>
</div>
</body>
</html>
